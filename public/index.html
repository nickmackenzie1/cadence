registerPlugin({
  id:'prep', name:'Meeting prep sheet', version:'1.0.0', builtin:true,
  description:'Before a call: what you owe, what they owe, what got done since last time, last meeting notes, and an agenda that carries into the meeting.',
  setup(api){
    const E = api.ui.esc;
    let saveT;
    function openPrep(c){
      const t = api.util.todayKey(), open = api.tasks.list(x => !x.done && x.clientId === c.id);
      const mtgs = api.meetings.list().filter(m => m.clientId === c.id).sort((a,b) => b.start - a.start), last = mtgs[0];
      const since = last ? last.start : Date.now() - 14 * 864e5;
      const done = api.tasks.list(x => x.done && x.clientId === c.id && x.doneAt >= since).sort((a,b) => b.doneAt - a.doneAt);
      const isOver = x => x.dueDate && x.dueDate < t;
      const mineOver = open.filter(x => x.owner === 'me' && isOver(x)), mine = open.filter(x => x.owner === 'me' && !isOver(x)), theirs = open.filter(x => x.owner === 'client').sort((a,b) => (a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
      const key = 'agenda:' + c.id;
      let agenda = api.storage.get(key) || '';
      if(!agenda.trim()){
        const lines = [];
        if(done.length) lines.push('• Recap wins: ' + done.slice(0,3).map(x => x.title).join('; '));
        if(theirs.length) lines.push(`• Their open items (${theirs.length}) — confirm dates` + (theirs.some(isOver) ? ', some overdue' : ''));
        if(mineOver.length || mine.length) lines.push(`• Our progress & blockers (${mineOver.length + mine.length} open)`);
        lines.push('• Next steps & next meeting');
        agenda = lines.join('\n');
      }
      const li = x => `<li>${E(x.title)}${x.assignee ? ` <span class="muted">· ${E(x.assignee)}</span>` : ''}${x.dueDate ? ` <span class="${isOver(x) && !x.done ? 'over' : 'muted'}">· ${E(api.util.fmtDate(x.dueDate))}</span>` : ''}</li>`;
      const sec = (title, list, cls, empty) => `<div class="prep-sec ${cls}"><h4>${title}<span>${list.length}</span></h4>${list.length ? `<ul>${list.slice(0,12).map(li).join('')}${list.length > 12 ? `<li class="muted">+${list.length-12} more</li>` : ''}</ul>` : `<div class="muted" style="font-size:13px">${empty}</div>`}</div>`;
      api.ui.modal(`${api.ui.avatar(c, 22)}&nbsp; Prep — ${E(c.name)}`, `
        <div class="muted" style="margin-top:-6px;font-size:13px">${last ? `Last meeting ${E(api.util.fmtDate(api.util.ymd(new Date(last.start))).toLowerCase())} · ${mtgs.length} meeting${mtgs.length===1?'':'s'} logged` : 'No meetings logged yet'}${c.domain ? ` · ${E(c.domain)}` : ''}</div>
        <div class="prep-grid">
          ${sec('Overdue on me', mineOver, 'danger', 'Nothing overdue 👍')}
          ${sec('Waiting on them', theirs, 'client', 'Nothing outstanding')}
          ${sec('Open on me', mine, '', 'All clear')}
          ${sec(last ? 'Done since last meeting' : 'Done in the last 2 weeks', done, 'ok', 'Nothing yet')}
        </div>
        ${last && last.notes ? `<details class="mtg"><summary><b>Last meeting notes</b><span class="muted">${E(new Date(last.start).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</span></summary><div class="notes">${E(last.notes)}</div></details>` : ''}
        <div class="field"><label>Agenda</label><textarea class="inp" id="prep-agenda" style="min-height:96px">${E(agenda)}</textarea><div class="muted" style="font-size:12px;margin-top:5px">Saved automatically and added to the meeting notes when you start.</div></div>`,
        `<button class="btn" id="prep-copy" style="margin-right:auto">Copy agenda</button><button class="btn" data-act="close-modal">Close</button><button class="btn primary" id="prep-start">◉ Start meeting</button>`, 'wide');
      const ta = document.querySelector('#prep-agenda');
      ta.addEventListener('input', () => { clearTimeout(saveT); saveT = setTimeout(() => api.storage.set(key, ta.value), 500); });
      document.querySelector('#prep-copy').onclick = () => api.ui.copy(`Agenda — ${c.name} (${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})})\n\n${ta.value.trim()}`);
      document.querySelector('#prep-start').onclick = () => {
        clearTimeout(saveT); const a = ta.value.trim(); api.storage.set(key, '');
        if(api.meetings.active()){ api.ui.toast('A meeting is already running — resuming it'); }
        api.meetings.start(c.id, a ? `Agenda\n${a}\n\nNotes\n` : '');
      };
    }
    api.clientActions.add({ id:'prep', label:'☰ Prep', primary:true, run: c => openPrep(c) });
    api.commands.add({ title:'Meeting prep for current client', run: api => { const r = api.ui.currentRoute(); if(!r.startsWith('client-')) return api.ui.toast('Open a client first'); openPrep(api.clients.get(r.slice(7))); } });
    window.CadencePrep = { open: openPrep };
  }
});

registerPlugin({
  id:'chase', name:'Chase client items', version:'1.0.0', builtin:true,
  description:'One click to write a polite reminder email listing everything a client owes you, overdue first. Marks items as chased.',
  setup(api){
    function chase(c){
      const t = api.util.todayKey();
      const items = api.tasks.list(x => !x.done && x.clientId === c.id && x.owner === 'client').sort((a,b) => (a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
      if(!items.length) return api.ui.toast(`${c.name} doesn’t owe you anything right now 🎉`);
      const over = items.filter(x => x.dueDate && x.dueDate < t).length;
      const mark = () => items.forEach(x => api.tasks.update(x.id, { lastChased: Date.now() }));
      const intro = over
        ? `Just a friendly nudge on a few items we’re waiting on from your side. ${over === 1 ? 'One is' : over + ' are'} now past the date we agreed, so getting ${over === 1 ? 'it' : 'them'} over will keep the project on track.`
        : `Just a quick nudge on the items we’re waiting on from your side to keep things moving.`;
      if(window.CadenceRecap){
        window.CadenceRecap.open({ clientName: c.name, mine: [], theirs: items, hideOurs: true, notes: '',
          title: '⚑ Chase email', theirLabel: 'Waiting on your side', subject: `${c.name} — friendly reminder: ${items.length} open item${items.length===1?'':'s'}`,
          intro, closing: 'If anything is blocked or you need a hand with any of these, just let me know and I’ll jump in.', onCopy: mark });
      } else {
        api.ui.copy(`${intro}\n\n${items.map(x => `• ${x.title}${x.dueDate ? ' — ' + api.util.fmtDate(x.dueDate) : ''}`).join('\n')}`); mark();
      }
    }
    api.clientActions.add({ id:'chase', label:'⚑  Chase outstanding items', where:['waiting'], short:'Chase', run: c => chase(c) });
    api.commands.add({ title:'Chase current client', run: api => { const r = api.ui.currentRoute(); if(!r.startsWith('client-')) return api.ui.toast('Open a client first'); chase(api.clients.get(r.slice(7))); } });
    window.CadenceChase = { chase };
  }
});

registerPlugin({
  id:'templates', name:'Project templates', version:'1.0.0', builtin:true,
  description:'Apply a checklist (Zoho CRM implementation, Books setup, Desk rollout, retainer…) to a client with real dates. Edit templates or save a client’s plan as a new one.',
  setup(api){
    const E = api.ui.esc;
    const DEFAULTS = [
      { id:'crm', name:'Zoho CRM implementation', body:`+0 Kickoff & discovery workshop
+1 ^ Share current process docs and a sample data export
+3 Map sales process & requirements
+5 Design CRM blueprint: modules, fields, layouts
+7 ^ Review & sign off on the CRM design
+10 Configure modules, fields and layouts
+12 Build workflows & automations (Deluge) #crm
+14 Data cleanup & import
+16 Set up users, roles & profiles
+18 ^ User acceptance testing
+20 Fix UAT feedback
+21 Admin & end-user training
+22 Go-live 🚀
+36 Post go-live check-in` },
      { id:'books', name:'Zoho Books setup', body:`+0 Kickoff: chart of accounts & tax review
+2 ^ Provide opening balances, bank details & logo
+4 Configure organization, taxes & currencies #books
+5 Set up chart of accounts & items
+6 Invoice & estimate templates
+7 Bank feeds & payment gateways
+8 Import customers, vendors & opening balances
+10 ^ Review test invoices
+12 Training session
+13 Go-live 🚀` },
      { id:'desk', name:'Zoho Desk rollout', body:`+0 Kickoff: support channels & SLAs
+2 ^ Provide support mailbox access & team list
+4 Configure departments, agents & roles #desk
+5 Set up email, web form & chat channels
+6 SLAs, assignment rules & blueprints
+8 Help center & knowledge base
+9 Integrate Desk with CRM
+10 ^ Test ticket flows
+12 Agent training
+13 Go-live 🚀` },
      { id:'retainer', name:'Monthly retainer cycle', body:`+0 Monthly check-in call
+0 ^ Send priorities for the month
+2 Review system health & usage reports
+25 Send monthly summary` }
    ];
    const list = () => api.storage.get('templates') || DEFAULTS;
    const parse = body => body.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const m = l.match(/^(?:\+?(\d+)\s*(d|w)?\b)?\s*(\^(\S*))?\s*(.+)$/i);
      return { offset: (+(m[1]||0)) * (/w/i.test(m[2]||'') ? 7 : 1), owner: m[3] ? 'client' : 'me', assignee: m[4] || '', text: m[5] };
    });
    const shift = (d, skip) => { if(skip){ while(d.getDay() === 0 || d.getDay() === 6) d = api.util.addDays(d, 1); } return d; };

    function apply(c, preId){
      const tpls = list();
      api.ui.modal(`${api.ui.avatar(c,22)}&nbsp; Apply template — ${E(c.name)}`, `
        <div class="row" style="gap:12px;align-items:flex-end">
          <div class="field" style="flex:2"><label>Template</label><select class="inp" id="tp-sel">${tpls.map((t,i) => `<option value="${i}" ${t.id===preId?'selected':''}>${E(t.name)}</option>`).join('')}</select></div>
          <div class="field" style="flex:1"><label>Start date</label><input class="inp" type="date" id="tp-start" value="${api.util.todayKey()}"></div>
        </div>
        <label class="row muted" style="align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="tp-wk" checked> Move weekend dates to Monday</label>
        <div id="tp-prev"></div>`,
        `<button class="btn ghost" id="tp-edit" style="margin-right:auto">Edit templates…</button><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" id="tp-go">Add tasks</button>`, 'wide');
      const $ = s => document.querySelector(s);
      const build = () => {
        const tpl = tpls[+$('#tp-sel').value], start = $('#tp-start').value || api.util.todayKey();
        const [y,m,d] = start.split('-').map(Number), base = new Date(y, m-1, d);
        return parse(tpl.body).map(it => { const r = api.util.parse(it.text, { owner: it.owner }); return { ...it, title: r.title, tags: r.tags, dueDate: api.util.ymd(shift(api.util.addDays(base, it.offset), $('#tp-wk').checked)) }; });
      };
      const draw = () => { const items = build(); $('#tp-prev').innerHTML = `<div class="group"><div class="group-h">${items.length} tasks</div>${items.map(i => `<div class="rv-item" style="grid-template-columns:1fr auto auto"><span>${E(i.title)}${i.tags.map(t => ` <span class="chip">#${E(t)}</span>`).join('')}</span>${i.owner==='client' ? `<span class="chip client-owned">↗ ${E(i.assignee || c.name)}</span>` : '<span></span>'}<span class="muted" style="font-size:12px;white-space:nowrap">${E(api.util.fmtDate(i.dueDate))}</span></div>`).join('')}</div>`; };
      ['#tp-sel','#tp-start','#tp-wk'].forEach(s => $(s).addEventListener('change', draw)); draw();
      $('#tp-edit').onclick = () => edit(() => apply(c));
      $('#tp-go').onclick = () => {
        const items = build(), tpl = tpls[+$('#tp-sel').value];
        items.forEach(i => api.tasks.add({ title: i.title, clientId: c.id, owner: i.owner, assignee: i.assignee, dueDate: i.dueDate, tags: i.tags }));
        api.ui.close(); api.ui.navigate('client-' + c.id); api.ui.refresh();
        api.ui.toast(`Added ${items.length} tasks from “${tpl.name}”`);
      };
    }
    function edit(back){
      let tpls = JSON.parse(JSON.stringify(list())), cur = 0;
      const draw = () => {
        api.ui.modal('Edit templates', `
          <div class="row" style="gap:8px;flex-wrap:wrap">${tpls.map((t,i) => `<button class="btn ${i===cur?'primary':''}" data-tpi="${i}">${E(t.name)}</button>`).join('')}<button class="btn ghost" id="te-new">+ New</button></div>
          ${tpls[cur] ? `<div class="field"><label>Name</label><input class="inp" id="te-name" value="${E(tpls[cur].name)}"></div>
          <div class="field"><label>Tasks — one per line</label><textarea class="inp" id="te-body" style="min-height:260px;font-family:var(--mono);font-size:12.5px">${E(tpls[cur].body)}</textarea>
          <div class="muted" style="font-size:12px;margin-top:6px"><code>+5</code> = 5 days after start (<code>+2w</code> for weeks) · <code>^</code> = client’s item, <code>^Sarah</code> to name someone · <code>#tag</code> works too</div></div>` : '<div class="muted">No templates. Add one.</div>'}`,
          `${tpls[cur] ? '<button class="btn ghost danger" id="te-del" style="margin-right:auto">Delete template</button>' : ''}<button class="btn" id="te-reset" ${tpls[cur]?'':'style="margin-right:auto"'}>Restore defaults</button><button class="btn" id="te-cancel">Cancel</button><button class="btn primary" id="te-save">Save</button>`, 'wide');
        const $ = s => document.querySelector(s);
        const grab = () => { if(tpls[cur] && $('#te-name')){ tpls[cur].name = $('#te-name').value.trim() || 'Untitled'; tpls[cur].body = $('#te-body').value; } };
        document.querySelectorAll('[data-tpi]').forEach(b => b.onclick = () => { grab(); cur = +b.dataset.tpi; draw(); });
        $('#te-new').onclick = () => { grab(); tpls.push({ id: 'u' + Date.now(), name: 'New template', body: '+0 Kickoff\n+3 ^ Client to send…\n+7 Deliver…' }); cur = tpls.length - 1; draw(); };
        if($('#te-del')) $('#te-del').onclick = () => { tpls.splice(cur, 1); cur = 0; draw(); };
        $('#te-reset').onclick = () => { tpls = JSON.parse(JSON.stringify(DEFAULTS)); cur = 0; draw(); };
        $('#te-cancel').onclick = () => back ? back() : api.ui.close();
        $('#te-save').onclick = () => { grab(); api.storage.set('templates', tpls); api.ui.toast('Templates saved'); back ? back() : api.ui.close(); };
      };
      draw();
    }
    function saveAs(c){
      const open = api.tasks.list(x => !x.done && x.clientId === c.id).sort((a,b) => (a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
      if(!open.length) return api.ui.toast('This client has no open tasks to save');
      const first = open.find(x => x.dueDate)?.dueDate, base = first ? new Date(first.replace(/-/g,'/')) : new Date();
      const body = open.map(x => { const off = x.dueDate ? Math.max(0, Math.round((new Date(x.dueDate.replace(/-/g,'/')) - base) / 864e5)) : 0; return `+${off} ${x.owner === 'client' ? '^' + (x.assignee ? x.assignee.split(' ')[0] : '') + ' ' : ''}${x.title}${(x.tags||[]).map(t => ' #' + t).join('')}`; }).join('\n');
      const tpls = list().slice(); tpls.push({ id: 'u' + Date.now(), name: `${c.name} plan`, body });
      api.storage.set('templates', tpls); edit(); setTimeout(() => { const btns = document.querySelectorAll('[data-tpi]'); btns[btns.length-1] && btns[btns.length-1].click(); }, 30);
      api.ui.toast('Saved as a template — rename it and tidy up');
    }
    api.clientActions.add({ id:'tpl-apply', label:'▤  Apply project template', run: c => apply(c) });
    api.clientActions.add({ id:'tpl-save', label:'⎘  Save open tasks as template', run: c => saveAs(c) });
    api.commands.add({ title:'Apply project template to current client', run: api => { const r = api.ui.currentRoute(); if(!r.startsWith('client-')) return api.ui.toast('Open a client first'); apply(api.clients.get(r.slice(7))); } });
    api.commands.add({ title:'Edit project templates', run: () => edit() });
    window.CadenceTemplates = { apply: (c, id) => apply(c, id), name: id => { const t = list().find(x => x.id === id); return t ? t.name : ''; } };
  }
});

registerPlugin({
  id:'review', name:'Weekly review', version:'1.0.0', builtin:true,
  description:'Friday-afternoon look back: what got done per client, what slipped, who owes you, who has gone quiet, and what’s coming next week.',
  setup(api){
    const E = api.ui.esc;
    const monday = () => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
    api.views.add({ id:'review', title:'Weekly review', icon:'✦', subtitle:'', render: (el, api) => {
      const t = api.util.todayKey(), wk = monday().getTime(), clients = api.clients.list(), cmap = Object.fromEntries(clients.map(c => [c.id, c]));
      const all = api.tasks.list(), open = all.filter(x => !x.done);
      const doneWk = all.filter(x => x.done && x.doneAt >= wk), mtgWk = api.meetings.list().filter(m => m.start >= wk);
      const slipped = open.filter(x => x.owner === 'me' && x.dueDate && x.dueDate < t).sort((a,b) => a.dueDate.localeCompare(b.dueDate));
      const owed = open.filter(x => x.owner === 'client' && x.dueDate && x.dueDate < t);
      const nextEnd = api.util.ymd(api.util.addDays(new Date(), 8));
      const nextWk = open.filter(x => x.owner === 'me' && x.dueDate && x.dueDate > t && x.dueDate <= nextEnd);
      const quiet = clients.filter(c => c.status !== 'paused').map(c => { const last = Math.max(0, ...api.meetings.list().filter(m => m.clientId === c.id).map(m => m.start), ...all.filter(x => x.clientId === c.id).map(x => x.doneAt || x.createdAt)); return { c, days: last ? Math.floor((Date.now() - last) / 864e5) : null }; }).filter(r => r.days === null || r.days >= 14);
      const byClient = (arr) => { const g = {}; arr.forEach(x => (g[x.clientId || '_'] = g[x.clientId || '_'] || []).push(x)); return Object.entries(g).sort((a,b) => b[1].length - a[1].length); };
      const cname = id => cmap[id] ? `${api.ui.avatar(cmap[id], 18)} ${E(cmap[id].name)}` : '<span class="muted">No client</span>';
      const stat = (v, l, color) => `<div class="stat"><div class="v" style="${color ? 'color:' + color : ''}">${v}</div><div class="l">${l}</div></div>`;
      const row = (x, extra = '') => `<div class="rv-row" data-go="${x.clientId ? 'client-' + x.clientId : ''}"><span>${E(x.title)}</span>${extra}</div>`;
      el.innerHTML = `
        <div class="muted" style="margin:-14px 0 18px">Week of ${monday().toLocaleDateString(undefined,{month:'long',day:'numeric'})}</div>
        <div class="stats">${stat(doneWk.length, 'Completed this week', 'var(--ok)')}${stat(mtgWk.length, 'Meetings')}${stat(slipped.length, 'Slipped (overdue on me)', slipped.length ? 'var(--danger)' : '')}${stat(owed.length, 'Overdue from clients', owed.length ? 'var(--client)' : '')}</div>
        <div class="cols">
          <div>
            <div class="group"><div class="group-h">✓ Done this week<span class="c">${doneWk.length}</span></div>
              ${byClient(doneWk).map(([cid, xs]) => `<details class="rv-c"><summary>${cname(cid)}<span class="muted" style="margin-left:auto">${xs.length}</span></summary>${xs.map(x => row(x)).join('')}</details>`).join('') || '<div class="muted" style="padding:8px 4px">Nothing completed yet this week.</div>'}</div>
            <div class="group"><div class="group-h danger">⚠ Slipped<span class="c">${slipped.length}</span></div>
              ${slipped.map(x => row(x, `<span class="chip">${cmap[x.clientId] ? E(cmap[x.clientId].name) : ''}</span><span class="chip due over">${E(api.util.fmtDate(x.dueDate))}</span>`)).join('') || '<div class="muted" style="padding:8px 4px">Nothing slipped. Nice.</div>'}</div>
          </div>
          <div>
            <div class="group"><div class="group-h client">↗ Clients owe you (overdue)<span class="c">${owed.length}</span></div>
              ${byClient(owed).map(([cid, xs]) => `<div class="rv-c-row">${cname(cid)}<span class="muted">${xs.length} item${xs.length===1?'':'s'}</span>${cmap[cid] && window.CadenceChase ? `<button class="btn" data-chase="${cid}" style="margin-left:auto;padding:4px 10px">⚑ Chase</button>` : ''}</div>`).join('') || '<div class="muted" style="padding:8px 4px">Everyone’s on time.</div>'}</div>
            <div class="group"><div class="group-h">◌ Gone quiet (14+ days)<span class="c">${quiet.length}</span></div>
              ${quiet.map(r => `<div class="rv-c-row" data-go="client-${r.c.id}" style="cursor:pointer">${cname(r.c.id)}<span class="muted" style="margin-left:auto">${r.days === null ? 'no activity' : r.days + ' days'}</span></div>`).join('') || '<div class="muted" style="padding:8px 4px">You’re in touch with everyone.</div>'}</div>
            <div class="group"><div class="group-h">→ Coming up (next 7 days)<span class="c">${nextWk.length}</span></div>
              ${nextWk.sort((a,b) => a.dueDate.localeCompare(b.dueDate)).slice(0, 12).map(x => row(x, `<span class="chip due">${E(api.util.fmtDate(x.dueDate))}</span>`)).join('') || '<div class="muted" style="padding:8px 4px">Nothing scheduled — a good time to plan.</div>'}</div>
          </div>
        </div>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="rv-copy">Copy summary</button></div>`;
      el.querySelectorAll('[data-go]').forEach(x => x.dataset.go && x.addEventListener('click', () => api.ui.navigate(x.dataset.go)));
      el.querySelectorAll('[data-chase]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); window.CadenceChase.chase(cmap[b.dataset.chase]); }));
      el.querySelector('#rv-copy').onclick = () => {
        const n = id => cmap[id] ? cmap[id].name : 'No client';
        api.ui.copy(`Weekly review — week of ${monday().toLocaleDateString(undefined,{month:'short',day:'numeric'})}\n\nDone (${doneWk.length})\n${byClient(doneWk).map(([cid, xs]) => `  ${n(cid)}: ${xs.map(x => x.title).join('; ')}`).join('\n') || '  —'}\n\nSlipped (${slipped.length})\n${slipped.map(x => `  • ${x.title} (${n(x.clientId)}, ${api.util.fmtDate(x.dueDate)})`).join('\n') || '  —'}\n\nOwed by clients (${owed.length})\n${byClient(owed).map(([cid, xs]) => `  ${n(cid)}: ${xs.length}`).join('\n') || '  —'}\n\nGone quiet: ${quiet.map(r => r.c.name).join(', ') || '—'}\nNext 7 days: ${nextWk.length} tasks`);
      };
    }});
    api.commands.add({ title:'Weekly review', hint:'R', run: api => api.ui.navigate('view-review') });
    // Friday-afternoon nudge, once a week, remembered per device (never touches synced data)
    setTimeout(() => {
      const d = new Date(); if(d.getDay() !== 5 || d.getHours() < 14) return;
      const k = 'cadence.reviewNudge', wkKey = api.util.ymd(monday());
      try { if(localStorage.getItem(k) === wkKey) return; localStorage.setItem(k, wkKey); } catch(e){ return; }
      api.ui.toast('It’s Friday — time for your weekly review ✦', [{ label:'Open review', run: () => api.ui.navigate('view-review') }]);
    }, 4000);
  }
});
